<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Three Brothers Fresh Chicken | Fresh Chicken Delivery</title>

<meta name="description" content="Three Brothers Fresh Chicken - Fresh Live Chicken, Dressed Chicken, Skinless, Boneless and Chicken Liver with Home Delivery in Naruli Bazar, North 24 Parganas.">

<meta name="keywords" content="fresh chicken, chicken delivery, Naruli Bazar chicken, North 24 Parganas chicken, live chicken, dressed chicken, boneless chicken">

<meta name="theme-color" content="#0b120e">

<style>
:root{
  --green:#19d66b;
  --green2:#0da957;
  --dark:#07100b;
  --dark2:#0d1711;
  --card:#101d15;
  --card2:#14241a;
  --white:#ffffff;
  --muted:#a9b7ae;
  --line:rgba(255,255,255,.09);
  --red:#ff4b4b;
  --yellow:#ffd84d;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 20% 0%,rgba(25,214,107,.10),transparent 30%),
    radial-gradient(circle at 100% 20%,rgba(25,214,107,.07),transparent 30%),
    var(--dark);
  color:var(--white);
  overflow-x:hidden;
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font-family:inherit;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* ================= NAVBAR ================= */

.navbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  background:rgba(7,16,11,.78);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.nav-inner{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  font-size:18px;
}

.logo-icon{
  width:42px;
  height:42px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--green),#8cffbd);
  color:#061009;
  font-size:22px;
  box-shadow:0 8px 25px rgba(25,214,107,.22);
}

.logo span{
  color:var(--green);
}

.nav-links{
  display:flex;
  gap:24px;
  color:#d7e2da;
  font-size:14px;
  font-weight:700;
}

.nav-links a{
  transition:.25s;
}

.nav-links a:hover{
  color:var(--green);
}

.nav-cart{
  border:1px solid rgba(25,214,107,.3);
  background:rgba(25,214,107,.1);
  color:var(--green);
  padding:11px 16px;
  border-radius:14px;
  cursor:pointer;
  font-weight:800;
}

.cart-count{
  background:var(--green);
  color:#061009;
  padding:2px 7px;
  border-radius:20px;
  margin-left:5px;
}

/* ================= HERO ================= */

.hero{
  min-height:760px;
  padding-top:72px;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  background:rgba(25,214,107,.10);
  filter:blur(100px);
  border-radius:50%;
  top:100px;
  right:-100px;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:60px;
  align-items:center;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:9px 14px;
  border-radius:30px;
  background:rgba(25,214,107,.08);
  border:1px solid rgba(25,214,107,.22);
  color:#9fffc5;
  font-size:13px;
  font-weight:800;
  margin-bottom:20px;
}

.badge-dot{
  width:8px;
  height:8px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 12px var(--green);
}

.hero h1{
  font-size:clamp(42px,6vw,76px);
  line-height:1;
  letter-spacing:-3px;
  margin-bottom:24px;
}

.hero h1 span{
  color:var(--green);
}

.hero-text{
  max-width:650px;
  color:var(--muted);
  line-height:1.8;
  font-size:17px;
  margin-bottom:30px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.btn{
  border:0;
  cursor:pointer;
  padding:15px 21px;
  border-radius:15px;
  font-weight:900;
  transition:.25s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
}

.btn-primary{
  background:linear-gradient(135deg,var(--green),#7dffb0);
  color:#061009;
  box-shadow:0 15px 35px rgba(25,214,107,.2);
}

.btn-primary:hover{
  transform:translateY(-3px);
}

.btn-dark{
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  color:white;
}

.btn-dark:hover{
  background:rgba(255,255,255,.08);
}

.hero-card{
  position:relative;
  min-height:500px;
  border-radius:35px;
  overflow:hidden;
  background:
    linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),
    var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}

.hero-image{
  height:100%;
  min-height:500px;
  display:grid;
  place-items:center;
  font-size:180px;
  background:
    radial-gradient(circle,rgba(25,214,107,.18),transparent 55%),
    linear-gradient(135deg,#17281d,#09120c);
}

.floating{
  position:absolute;
  padding:14px 17px;
  border-radius:17px;
  background:rgba(7,16,11,.85);
  backdrop-filter:blur(12px);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}

.float-one{
  top:30px;
  left:25px;
}

.float-two{
  right:25px;
  bottom:30px;
}

.floating strong{
  display:block;
  margin-bottom:4px;
}

.floating small{
  color:var(--muted);
}

/* ================= TRUST ================= */

.trust{
  padding:20px 0 70px;
}

.trust-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.trust-box{
  padding:22px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
  border-radius:20px;
  text-align:center;
}

.trust-box b{
  display:block;
  color:var(--green);
  font-size:25px;
  margin-bottom:6px;
}

.trust-box span{
  color:var(--muted);
  font-size:13px;
}

/* ================= SECTION ================= */

section{
  padding:95px 0;
}

.section-head{
  text-align:center;
  max-width:720px;
  margin:0 auto 50px;
}

.eyebrow{
  color:var(--green);
  font-weight:900;
  font-size:13px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:12px;
}

.section-head h2{
  font-size:clamp(32px,5vw,52px);
  margin-bottom:14px;
}

.section-head p{
  color:var(--muted);
  line-height:1.7;
}

/* ================= ABOUT ================= */

.about-wrapper{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:70px;
  align-items:center;
}

.about-lead{
  font-size:22px;
  line-height:1.6;
  font-weight:800;
  margin-bottom:18px;
}

.about-lead span{
  color:var(--green);
}

.about-text{
  color:var(--muted);
  line-height:1.85;
  margin-bottom:25px;
}

.about-points{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.about-point{
  padding:16px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
  border-radius:17px;
}

.about-point b{
  display:block;
  margin-bottom:5px;
}

.about-point span{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.about-visual{
  min-height:500px;
  position:relative;
  display:grid;
  place-items:center;
}

.about-circle{
  width:340px;
  height:340px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 35% 30%,rgba(25,214,107,.22),transparent 40%),
    #101d15;
  border:1px solid rgba(25,214,107,.2);
  box-shadow:0 0 90px rgba(25,214,107,.09);
}

.about-chicken{
  font-size:150px;
  filter:drop-shadow(0 20px 30px rgba(0,0,0,.35));
}

.about-ring{
  position:absolute;
  border-radius:50%;
  border:1px dashed rgba(25,214,107,.35);
}

.ring-one{
  width:400px;
  height:400px;
}

.ring-two{
  width:470px;
  height:470px;
  border-color:rgba(255,255,255,.08);
}

.about-card{
  position:absolute;
  background:rgba(8,17,11,.9);
  backdrop-filter:blur(14px);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px 18px;
  box-shadow:var(--shadow);
}

.card-top{
  top:35px;
  right:0;
}

.card-bottom{
  bottom:35px;
  left:0;
}

.card-top strong,
.card-bottom strong{
  display:block;
  margin-bottom:5px;
}

.card-top span,
.card-bottom span{
  color:var(--muted);
  font-size:12px;
}

.promise{
  margin-top:80px;
  padding:40px;
  border:1px solid rgba(25,214,107,.15);
  border-radius:28px;
  background:
    radial-gradient(circle at 100% 0%,rgba(25,214,107,.08),transparent 40%),
    rgba(255,255,255,.025);
}

.promise-head{
  margin-bottom:28px;
}

.promise-head h3{
  font-size:30px;
  margin-bottom:8px;
}

.promise-head p{
  color:var(--muted);
}

.promise-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.promise-card{
  padding:20px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
  border-radius:18px;
}

.promise-icon{
  font-size:25px;
  margin-bottom:12px;
}

.promise-card b{
  display:block;
  margin-bottom:7px;
}

.promise-card span{
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
}

.story-box{
  margin-top:22px;
  padding:25px;
  border-radius:22px;
  background:linear-gradient(135deg,rgba(25,214,107,.08),rgba(255,255,255,.02));
  border:1px solid rgba(25,214,107,.13);
}

.story-box p{
  color:#c9d5cd;
  line-height:1.8;
}

.story-number{
  color:var(--green);
  font-weight:900;
  font-size:12px;
  letter-spacing:2px;
  margin-bottom:10px;
}

/* ================= PRODUCTS ================= */

.products{
  background:rgba(255,255,255,.018);
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:16px;
}

.product{
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid var(--line);
  border-radius:23px;
  padding:15px;
  transition:.3s;
}

.product:hover{
  transform:translateY(-7px);
  border-color:rgba(25,214,107,.3);
}

.product-image{
  height:190px;
  border-radius:17px;
  display:grid;
  place-items:center;
  font-size:90px;
  background:
    radial-gradient(circle,rgba(25,214,107,.14),transparent 55%),
    #101b14;
  margin-bottom:15px;
}

.product h3{
  font-size:17px;
  margin-bottom:7px;
}

.product p{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  min-height:36px;
}

.product-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:16px;
  gap:8px;
}

.price{
  font-weight:900;
  color:var(--green);
}

.price small{
  color:var(--muted);
  font-weight:500;
}

.add-btn{
  border:0;
  background:var(--green);
  color:#061009;
  font-weight:900;
  border-radius:12px;
  padding:10px 12px;
  cursor:pointer;
}

/* ================= OFFER ================= */

.offer{
  padding:0 0 95px;
}

.offer-box{
  border:1px solid rgba(25,214,107,.2);
  border-radius:28px;
  padding:38px;
  background:
    linear-gradient(100deg,rgba(25,214,107,.12),rgba(255,255,255,.025));
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.offer-box h3{
  font-size:30px;
  margin-bottom:8px;
}

.offer-box p{
  color:var(--muted);
}

/* ================= WHY ================= */

.why-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.why-card{
  padding:25px;
  border-radius:22px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
}

.why-icon{
  width:52px;
  height:52px;
  border-radius:16px;
  display:grid;
  place-items:center;
  background:rgba(25,214,107,.09);
  font-size:25px;
  margin-bottom:18px;
}

.why-card h3{
  margin-bottom:9px;
}

.why-card p{
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
}

/* ================= GALLERY ================= */

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.gallery-item{
  min-height:190px;
  border-radius:22px;
  display:grid;
  place-items:center;
  font-size:80px;
  border:1px solid var(--line);
  background:
    radial-gradient(circle,rgba(25,214,107,.13),transparent 55%),
    #101b14;
  overflow:hidden;
  transition:.3s;
}

.gallery-item:hover{
  transform:scale(1.025);
}

/* ================= REVIEWS ================= */

.reviews{
  background:rgba(255,255,255,.018);
}

.review-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.review{
  padding:25px;
  border-radius:22px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
}

.stars{
  color:var(--yellow);
  letter-spacing:2px;
  margin-bottom:15px;
}

.review p{
  color:#d4ddd7;
  line-height:1.7;
  margin-bottom:20px;
}

.review strong{
  display:block;
}

.review span{
  color:var(--muted);
  font-size:12px;
}

/* ================= CONTACT ================= */

.contact-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.contact-card{
  padding:30px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
  border-radius:25px;
}

.contact-row{
  display:flex;
  gap:15px;
  margin:18px 0;
  align-items:flex-start;
}

.contact-icon{
  width:45px;
  height:45px;
  border-radius:13px;
  background:rgba(25,214,107,.1);
  display:grid;
  place-items:center;
  flex-shrink:0;
}

.contact-row span{
  display:block;
  color:var(--muted);
  margin-top:4px;
  line-height:1.5;
}

.map-box{
  min-height:340px;
  border-radius:25px;
  border:1px solid var(--line);
  background:
    linear-gradient(rgba(7,16,11,.55),rgba(7,16,11,.7)),
    radial-gradient(circle at 30% 40%,rgba(25,214,107,.18),transparent 30%),
    #111c15;
  display:grid;
  place-items:center;
  text-align:center;
  padding:30px;
}

.map-box h3{
  margin-bottom:10px;
}

.map-box p{
  color:var(--muted);
  margin-bottom:20px;
}

/* ================= FOOTER ================= */

footer{
  border-top:1px solid var(--line);
  padding:35px 0 100px;
  color:var(--muted);
}

.footer-inner{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
}

.footer-brand{
  color:white;
  font-weight:900;
}

.footer-brand span{
  color:var(--green);
}

.footer-copy{
  font-size:13px;
}

/* ================= CART ================= */

.cart-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(5px);
  z-index:1999;
  display:none;
}

.cart-overlay.show{
  display:block;
}

.cart-drawer{
  position:fixed;
  top:0;
  right:-440px;
  width:min(420px,92%);
  height:100vh;
  background:#0b1510;
  border-left:1px solid var(--line);
  z-index:2000;
  transition:.35s;
  display:flex;
  flex-direction:column;
}

.cart-drawer.open{
  right:0;
}

.cart-head{
  padding:20px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.close{
  background:rgba(255,255,255,.07);
  border:0;
  color:white;
  width:38px;
  height:38px;
  border-radius:12px;
  cursor:pointer;
  font-size:20px;
}

.cart-items{
  flex:1;
  overflow:auto;
  padding:18px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:70px 20px;
}

.cart-item{
  display:flex;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.cart-item-icon{
  width:55px;
  height:55px;
  border-radius:14px;
  background:#14231a;
  display:grid;
  place-items:center;
  font-size:28px;
  flex-shrink:0;
}

.cart-info{
  flex:1;
}

.cart-info strong{
  display:block;
  margin-bottom:5px;
}

.cart-info small{
  color:var(--muted);
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:8px;
}

.qty button{
  width:28px;
  height:28px;
  border:0;
  border-radius:9px;
  background:rgba(255,255,255,.08);
  color:white;
  cursor:pointer;
}

.cart-price{
  color:var(--green);
  font-weight:900;
}

.cart-bottom{
  padding:20px;
  border-top:1px solid var(--line);
}

.total-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  color:var(--muted);
}

.total-row.final{
  color:white;
  font-size:20px;
  font-weight:900;
  margin-top:15px;
}

.total-row.final span:last-child{
  color:var(--green);
}

.checkout-btn{
  width:100%;
  margin-top:18px;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:3000;
  display:none;
  place-items:center;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(7px);
  padding:20px;
}

.modal.show{
  display:grid;
}

.modal-box{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:#0b1510;
  border:1px solid var(--line);
  border-radius:28px;
  padding:25px;
  box-shadow:var(--shadow);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.modal-head h2{
  font-size:25px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  color:#d7e1db;
  font-weight:700;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid var(--line);
  background:#101c15;
  color:white;
  padding:14px;
  border-radius:13px;
  outline:none;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
  border-color:rgba(25,214,107,.5);
}

.order-summary{
  margin:18px 0;
  padding:16px;
  border-radius:17px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
}

.order-summary-row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
  color:var(--muted);
}

.order-summary-row:last-child{
  color:white;
  font-size:19px;
  font-weight:900;
  padding-top:10px;
  border-top:1px solid var(--line);
}

.order-summary-row:last-child span:last-child{
  color:var(--green);
}

/* ================= MOBILE NAV ================= */

.mobile-nav{
  display:none;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1000px){

  .product-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .why-grid{
